name: theschool-test

services:
  tests:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    entrypoint: ["sh", "/var/www/html/docker/test-entrypoint.sh"]
    command: ["--log-junit", "storage/logs/phpunit.xml"]
    environment:
      APP_ENV: testing
      APP_KEY: base64:MiIdtX2yS+VOQaKgFspOHwH/pbCDDhJMWQe3C4WoI/A=
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: school_test
      DB_USERNAME: school_test
      DB_PASSWORD: test_password
      DB_URL: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      VIEW_COMPILED_PATH: /var/www/html/storage/framework/views
    volumes:
      - ./server:/var/www/html:ro
      - vendor:/var/www/html/vendor
      - storage:/var/www/html/storage
      - bootstrap-cache:/var/www/html/bootstrap/cache
      - uploads:/var/www/html/uploads
    depends_on:
      mariadb:
        condition: service_healthy

  infection:
    extends:
      service: tests
    profiles: ["mutation"]
    # Workers share one transactional database, so run mutations sequentially.
    command: ["infection", "--threads=1", "--no-progress", "--min-msi=80"]

  mariadb:
    build: ./sql
    environment:
      MARIADB_ROOT_PASSWORD: test_root_password
      MARIADB_DATABASE: school_test
      MARIADB_USER: school_test
      MARIADB_PASSWORD: test_password
    tmpfs:
      - /var/lib/mysql:mode=1777
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

volumes:
  vendor:
  storage:
  bootstrap-cache:
  uploads:
