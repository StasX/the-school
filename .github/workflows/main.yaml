name: main

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - README.md
      - LICENSE
      - .hintrc
      - server/.editorconfig

  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - README.md
      - .github/workflows/main.yaml
      - .github/workflows/docker.yaml

jobs:
  checkov:
    name: Checkov - ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            file: server/Dockerfile

          - name: redis
            file: redis/Dockerfile

          - name: sql
            file: sql/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          file: ${{ matrix.file }}
          framework: dockerfile
          quiet: true
          output_format: junitxml
          output_file_path: checkov-${{ matrix.name }}.xml

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-${{ matrix.name }}-results
          path: checkov-${{ matrix.name }}.xml
          if-no-files-found: warn

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Prepare Semgrep report directory
        run: mkdir -p semgrep-results

      - name: Run Semgrep
        run: |
          set +e

          semgrep scan \
            --config p/php \
            --config p/javascript \
            --config p/docker \
            --config p/security-audit \
            --json \
            --output semgrep-results/semgrep.json \
            --error \
            server redis sql

          EXIT_CODE=$?

          if [ "$EXIT_CODE" -ne 0 ]; then
            semgrep scan \
              --config p/php \
              --config p/javascript \
              --config p/docker \
              --config p/security-audit \
              --error \
              server redis sql
          fi

          exit "$EXIT_CODE"

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-results
          path: semgrep-results/semgrep.json

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare PHPStan report directory
        run: mkdir -p storage/phpstan

      - name: Run PHPStan
        run: |
          set +e
          vendor/bin/phpstan analyse \
            --no-progress \
            --error-format=json \
            > storage/phpstan/phpstan.json
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            vendor/bin/phpstan analyse --no-progress
          fi
          exit $EXIT_CODE
      - name: Upload PHPStan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpstan-results
          path: server/storage/phpstan/phpstan.json
          if-no-files-found: warn

  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare PHPCS report directory
        run: mkdir -p storage/phpcs

      - name: Run PHPCS
        run: |
          set +e

          vendor/bin/phpcs \
            --report=json \
            --report-file=storage/phpcs/phpcs.json

          EXIT_CODE=$?

          if [ $EXIT_CODE -ne 0 ]; then
            vendor/bin/phpcs
          fi

          exit $EXIT_CODE

      - name: Upload PHPCS report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpcs-results
          path: server/storage/phpcs/phpcs.json
          if-no-files-found: warn

  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare PHP-CS-Fixer report directory
        run: mkdir -p storage/php-cs-fixer

      - name: Run PHP-CS-Fixer
        run: |
          set +e

          vendor/bin/php-cs-fixer fix \
            --dry-run \
            --diff \
            > storage/php-cs-fixer/php-cs-fixer.txt 2>&1

          EXIT_CODE=$?

          cat storage/php-cs-fixer/php-cs-fixer.txt

          exit $EXIT_CODE

      - name: Upload PHP-CS-Fixer report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: php-cs-fixer-results
          path: server/storage/php-cs-fixer/php-cs-fixer.txt
          if-no-files-found: warn

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit
        run: php artisan test --log-junit storage/logs/phpunit.xml

      - name: Upload PHPUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-results
          path: server/storage/logs/phpunit.xml
          if-no-files-found: warn

  infection:
    name: Infection
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, fileinfo
          coverage: pcov

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          mkdir -p storage/infection

      - name: Run Infection
        run: |
          vendor/bin/infection \
            --threads=4 \
            --no-progress \
            --min-msi=80

      - name: Upload Infection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infection-results
          path: |
            server/storage/infection/infection.log
            server/storage/infection/infection.json
          if-no-files-found: warn

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  cypress:
    name: Cypress E2E
    runs-on: ubuntu-latest
    needs:
      - checkov
      - phpunit
      - phpstan
      - phpcs
      - php-cs-fixer
      - frontend
      - semgrep
      - infection
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Cypress dependencies
        run: npm ci

      - name: Prepare environment
        run: cp server/.env.example .env

      - name: Start application
        run: docker compose up -d --build

      - name: Wait for application
        run: |
          set -a
          source .env
          set +a

          for i in {1..30}; do
            if curl --fail "$APP_URL" > /dev/null 2>&1; then
              exit 0
            fi

            echo "Waiting for application..."
            sleep 5
          done

          echo "Application did not start"
          docker compose logs
          exit 1

      - name: Run Cypress
        run: |
          set -a
          source .env
          set +a
          npm run cypress:run

      - name: Save Docker logs
        if: failure()
        run: docker compose logs > docker.log 2>&1

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-logs
          path: docker.log
          if-no-files-found: ignore

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore

      - name: Stop application
        if: always()
        run: docker compose down -v
