name: Docker Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

jobs:
  release-checks:
    name: Verify release commit and CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require tag to point to latest main commit
        id: commit
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          release_sha=$(git rev-parse HEAD)
          if [ "$release_sha" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Release tag must point to the latest main commit."
            exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Require successful main CI for the tagged commit
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'main.yaml',
              branch: 'main',
              event: 'push',
              head_sha: process.env.RELEASE_SHA,
              per_page: 100,
            });
            const run = data.workflow_runs
              .sort((a, b) => b.run_number - a.run_number)[0];
            if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
              core.setFailed(
                `Main CI must complete successfully for ${process.env.RELEASE_SHA}. ` +
                (run ? `Current result: ${run.status}/${run.conclusion}. ${run.html_url}` : 'No matching push run found.') +
                ' Rerun this release after CI passes.'
              );
            }

  docker:
    name: Docker (${{ matrix.name }})
    needs: release-checks
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - name: server
            context: ./server
            dockerfile: ./server/Dockerfile
            image: theschool-server

          - name: redis
            context: ./redis
            dockerfile: ./redis/Dockerfile
            image: theschool-redis

          - name: sql
            context: ./sql
            dockerfile: ./sql/Dockerfile
            image: theschool-sql

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: local-${{ matrix.name }}:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local-${{ matrix.name }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push scanned image
        shell: bash
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "local-${{ matrix.name }}:${{ github.sha }}" "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
