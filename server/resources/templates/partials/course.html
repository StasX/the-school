<div class="row view-row">
    <div class="col">
        <b id="container-title">Add Course</b>
    </div>
</div>
<div class="row view-row bm">
    <div class="col">
        <hr class="col-sm-12 col-xs-12">
    </div>
</div>
<div id="btn-row" class="row view-row">
    <div class="col">
        <button id="save-course" class="btn btn-sm btn-dark">
            Save<i class="fa-solid fa-check"></i>
        </button>
    </div>
</div>
<form id="courses-form" class="container">
    <div class="row">
        <div class="col-4 d-flex">
            <img alt="uploaded image" id="image-upload" />
        </div>
        <div class="col-8">
            <div class="container">
                <div class="row">
                    <div class="col">
                        <div class="input-group mb-3">
                            <label for="name" class="input-group-text">Name</label>
                            <input type="text" id="name" name="name" class="form-control" spellcheck="false"
                                required="required" />
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <div class="input-group mb-3">
                            <label for="description" class="input-group-text">Description</label>
                            <textarea name="description" id="description" class="form-control" spellcheck="false"
                                rows="5" maxlength="500" required="required"></textarea>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col">
                        <div class="input-group mb-3">
                            <label for="image-file" class="input-group-text">Image</label>
                            <input type="file" id="image-file" name="image" class="form-control"
                                accept="image/jpeg,image/png,image/gif" />
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div id="alerts" class="col">
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
